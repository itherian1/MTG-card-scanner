<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG PWA Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Tesseract.js for in-browser OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #000; color: white; overscroll-behavior: none; }
        #video-container { position: relative; width: 100vw; height: 60vh; overflow: hidden; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* The targeting box that helps crop just the card name */
        #target-box {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 80%;
            height: 12%;
            border: 2px solid #10b981; /* Emerald 500 */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            pointer-events: none;
        }
        #target-box::after {
            content: 'ALIGN CARD NAME HERE';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #10b981;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .scanning-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: scan 1.5s infinite linear;
            display: none;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Camera Viewport -->
    <div id="video-container">
        <video id="camera" autoplay playsinline></video>
        <div id="target-box">
            <div id="scan-line" class="scanning-line"></div>
        </div>
    </div>

    <!-- Controls & List View -->
    <div class="flex-grow bg-slate-900 p-4 flex flex-col rounded-t-2xl -mt-4 relative z-10 border-t border-slate-700">
        
        <!-- Status & Buttons -->
        <div class="flex justify-between items-center mb-4">
            <div id="status" class="text-sm text-yellow-400 font-mono">Loading OCR Engine...</div>
            <button id="export-btn" onclick="exportList()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold shadow-lg hidden">
                Copy List
            </button>
        </div>

        <!-- Big Scan Button -->
        <button id="scan-btn" onclick="captureAndScan()" disabled class="w-full bg-slate-700 text-slate-400 py-4 rounded-xl font-bold text-lg transition-colors mb-4 border border-slate-600">
            Please Wait...
        </button>

        <!-- Scanned Inventory List -->
        <div class="flex-between text-xs text-slate-400 mb-2 px-1">
            <span>SCANNED CARDS</span>
            <span id="card-count">0</span>
        </div>
        <div class="flex-grow overflow-y-auto bg-slate-800 rounded-lg border border-slate-700 p-2">
            <ul id="inventory-list" class="space-y-1">
                <!-- Items inject here -->
            </ul>
        </div>
    </div>

    <!-- Hidden canvas used to extract image data for OCR -->
    <canvas id="hidden-canvas" class="hidden"></canvas>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetBox = document.getElementById('target-box');
        const scanBtn = document.getElementById('scan-btn');
        const statusTxt = document.getElementById('status');
        const scanLine = document.getElementById('scan-line');
        
        let worker = null;
        let inventory = {};
        let totalScanned = 0;

        // Initialize Camera
        async function startCamera() {
            try {
                // Request back camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
            } catch (err) {
                statusTxt.innerText = "Camera Access Denied";
                statusTxt.classList.replace('text-yellow-400', 'text-red-400');
                console.error("Camera error:", err);
                alert("This app requires camera permissions to scan cards.");
            }
        }

        // Initialize Tesseract OCR Worker
        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('eng');
                statusTxt.innerText = "Scanner Ready";
                statusTxt.classList.replace('text-yellow-400', 'text-emerald-400');
                
                scanBtn.disabled = false;
                scanBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
                scanBtn.classList.replace('text-slate-400', 'text-white');
                scanBtn.innerText = "TAP TO SCAN CARD";
            } catch (err) {
                statusTxt.innerText = "OCR Engine Failed";
                console.error("Tesseract error:", err);
            }
        }

        // Scan Action
        async function captureAndScan() {
            if (!worker) return;

            // UI Feedback
            scanBtn.disabled = true;
            scanBtn.innerText = "Reading...";
            scanBtn.classList.replace('bg-emerald-600', 'bg-emerald-800');
            scanLine.style.display = 'block';

            // Calculate the exact pixel coordinates of the targeting box relative to the video feed
            const videoRatio = video.videoWidth / video.clientWidth;
            const boxRect = targetBox.getBoundingClientRect();
            const videoRect = video.getBoundingClientRect();

            const cropX = (boxRect.left - videoRect.left) * videoRatio;
            const cropY = (boxRect.top - videoRect.top) * videoRatio;
            const cropWidth = boxRect.width * videoRatio;
            const cropHeight = boxRect.height * videoRatio;

            // Set canvas to the size of the crop box
            canvas.width = cropWidth;
            canvas.height = cropHeight;

            // Draw only the targeted portion of the video to the canvas
            ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            // Enhance contrast via canvas to help OCR (Optional but recommended for foil/glare)
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                // Simple grayscale and thresholding for better text pop
                const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                const threshold = avg > 120 ? 255 : 0; 
                data[i] = data[i+1] = data[i+2] = threshold;
            }
            ctx.putImageData(imageData, 0, 0);

            try {
                // Run OCR on the cropped canvas
                const { data: { text } } = await worker.recognize(canvas);
                
                // Clean up the text (remove newlines, weird symbols, leading/trailing spaces)
                const cleanName = text.replace(/[^a-zA-Z\s,'-]/g, '').trim().split('\n')[0]; // Take best first line

                if (cleanName.length > 2) {
                    addCardToInventory(cleanName);
                } else {
                    statusTxt.innerText = "Could not read name. Try again.";
                    setTimeout(() => { statusTxt.innerText = "Scanner Ready"; }, 2000);
                }

            } catch (err) {
                console.error(err);
                statusTxt.innerText = "Read Error";
            }

            // Restore UI
            scanLine.style.display = 'none';
            scanBtn.disabled = false;
            scanBtn.innerText = "TAP TO SCAN CARD";
            scanBtn.classList.replace('bg-emerald-800', 'bg-emerald-600');
        }

        // Inventory Management
        function addCardToInventory(cardName) {
            // Capitalize first letters for display
            const displayName = cardName.replace(/\b\w/g, l => l.toUpperCase());
            
            if (inventory[displayName]) {
                inventory[displayName]++;
            } else {
                inventory[displayName] = 1;
            }
            
            totalScanned++;
            document.getElementById('card-count').innerText = totalScanned;
            document.getElementById('export-btn').classList.remove('hidden');
            
            renderInventory();
            
            // Flash success
            statusTxt.innerText = `Added: ${displayName}`;
            statusTxt.classList.replace('text-emerald-400', 'text-blue-400');
            setTimeout(() => { 
                statusTxt.innerText = "Scanner Ready"; 
                statusTxt.classList.replace('text-blue-400', 'text-emerald-400');
            }, 1500);
        }

        function renderInventory() {
            const listEl = document.getElementById('inventory-list');
            listEl.innerHTML = '';
            
            // Render newer scans at the top
            const sortedCards = Object.entries(inventory).reverse();
            
            for (const [name, qty] of sortedCards) {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700";
                li.innerHTML = `
                    <span class="font-medium text-slate-200">${name}</span>
                    <div class="flex items-center space-x-3">
                        <span class="text-emerald-400 font-mono text-sm">${qty}x</span>
                        <button onclick="removeCard('${name}')" class="text-red-500 hover:text-red-400 font-bold px-2">&times;</button>
                    </div>
                `;
                listEl.appendChild(li);
            }
        }

        function removeCard(name) {
            totalScanned -= inventory[name];
            delete inventory[name];
            document.getElementById('card-count').innerText = totalScanned;
            if (totalScanned === 0) document.getElementById('export-btn').classList.add('hidden');
            renderInventory();
        }

        // Export to Clipboard
        function exportList() {
            let exportText = "";
            for (const [name, qty] of Object.entries(inventory)) {
                exportText += `${qty}x ${name}\n`;
            }

            navigator.clipboard.writeText(exportText).then(() => {
                const btn = document.getElementById('export-btn');
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-emerald-600', 'bg-blue-600');
                }, 2000);
            }).catch(err => {
                alert("Failed to copy to clipboard. Export feature requires HTTPS.");
            });
        }

        // Startup Sequence
        window.onload = () => {
            startCamera();
            initOCR();
        };
    </script>
</body>
</html>
