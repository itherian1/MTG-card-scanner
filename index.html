<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTG PWA Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #000; color: white; overscroll-behavior: none; }
        #video-container { position: relative; width: 100vw; height: 60vh; overflow: hidden; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* TIGHTER CROP: Made the box much thinner to avoid reading the art */
        #target-box { position: absolute; top: 15%; left: 10%; width: 80%; height: 8%; border: 2px solid #10b981; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); border-radius: 4px; pointer-events: none; }
        #target-box::after { content: 'FIT CARD NAME EXACTLY INSIDE'; position: absolute; top: -20px; left: 0; width: 100%; text-align: center; font-size: 10px; color: #10b981; font-weight: bold; letter-spacing: 1px; }
        
        .scanning-line { position: absolute; width: 100%; height: 2px; background: #10b981; box-shadow: 0 0 10px #10b981; animation: scan 1.5s infinite linear; display: none; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
    </style>
</head>
<body class="flex flex-col h-screen">
    <div id="video-container">
        <video id="camera" autoplay playsinline muted></video>
        <div id="target-box"><div id="scan-line" class="scanning-line"></div></div>
    </div>
    
    <div class="flex-grow bg-slate-900 p-4 flex flex-col rounded-t-2xl -mt-4 relative z-10 border-t border-slate-700">
        <div class="flex justify-between items-center mb-4">
            <div id="status" class="text-sm text-yellow-400 font-mono">Loading OCR Engine...</div>
            <button id="export-btn" onclick="exportList()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold shadow-lg hidden">Copy List</button>
        </div>
        
        <button id="scan-btn" onclick="captureAndScan()" disabled class="w-full bg-slate-700 text-slate-400 py-4 rounded-xl font-bold text-lg transition-colors mb-4 border border-slate-600">Please Wait...</button>
        
        <div class="flex-between text-xs text-slate-400 mb-2 px-1 flex justify-between">
            <span>SCANNED CARDS</span><span id="card-count">0</span>
        </div>
        <div class="flex-grow overflow-y-auto bg-slate-800 rounded-lg border border-slate-700 p-2">
            <ul id="inventory-list" class="space-y-1"></ul>
        </div>
    </div>
    
    <canvas id="hidden-canvas" class="hidden"></canvas>
    
    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetBox = document.getElementById('target-box');
        const scanBtn = document.getElementById('scan-btn');
        const statusTxt = document.getElementById('status');
        const scanLine = document.getElementById('scan-line');
        
        let worker = null; 
        let inventory = {}; 
        let totalScanned = 0;

        async function startCamera() {
            try {
                // Prioritize macro lenses or closely focused back cameras
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => { video.play().catch(e => console.error("Play failed:", e)); };
            } catch (err) {
                statusTxt.innerText = "Camera Access Denied"; 
                statusTxt.classList.replace('text-yellow-400', 'text-red-400'); 
                alert("This app requires camera permissions.");
            }
        }

        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('eng');
                // Optimize Tesseract to only look for letters, spaces, and MTG punctuation to reduce garbage output
                await worker.setParameters({
                    tessedit_char_whitelist: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ ',/-"
                });
                statusTxt.innerText = "Scanner Ready"; 
                statusTxt.classList.replace('text-yellow-400', 'text-emerald-400');
                scanBtn.disabled = false; 
                scanBtn.classList.replace('bg-slate-700', 'bg-emerald-600'); 
                scanBtn.classList.replace('text-slate-400', 'text-white'); 
                scanBtn.innerText = "TAP TO SCAN CARD";
            } catch (err) { 
                statusTxt.innerText = "OCR Engine Failed"; 
            }
        }

        // NEW FEATURE: Verify and Auto-correct with Scryfall API
        async function fetchRealCardName(scannedText) {
            try {
                // Scryfall's "fuzzy" search is brilliant at fixing typos
                const response = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(scannedText)}`);
                if (response.ok) {
                    const data = await response.json();
                    return data.name; // Returns the perfect, capitalized, official name
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        async function captureAndScan() {
            if (!worker) return;
            scanBtn.disabled = true; 
            scanBtn.innerText = "Reading..."; 
            scanBtn.classList.replace('bg-emerald-600', 'bg-emerald-800'); 
            scanLine.style.display = 'block';

            const videoRatio = video.videoWidth / video.clientWidth; 
            const boxRect = targetBox.getBoundingClientRect(); 
            const videoRect = video.getBoundingClientRect();
            
            const cropX = (boxRect.left - videoRect.left) * videoRatio; 
            const cropY = (boxRect.top - videoRect.top) * videoRatio; 
            const cropWidth = boxRect.width * videoRatio; 
            const cropHeight = boxRect.height * videoRatio;
            
            canvas.width = cropWidth; 
            canvas.height = cropHeight;
            ctx.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            // Enhance image contrast to help OCR drop the background
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height); 
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) { 
                const avg = (data[i] + data[i+1] + data[i+2]) / 3; 
                // Aggressive thresholding to make text black and background white
                const threshold = avg > 100 ? 255 : 0; 
                data[i] = data[i+1] = data[i+2] = threshold; 
            }
            ctx.putImageData(imageData, 0, 0);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                
                // Clean up the raw read
                let cleanName = text.trim().split('\n')[0];
                
                if (cleanName.length > 3) {
                    statusTxt.innerText = "Validating with Scryfall...";
                    statusTxt.classList.replace('text-emerald-400', 'text-yellow-400');
                    
                    // Secretly ping the Scryfall database to autocorrect it
                    const verifiedName = await fetchRealCardName(cleanName);
                    
                    if (verifiedName) {
                        addCardToInventory(verifiedName);
                    } else {
                        statusTxt.innerText = "Card not found. Try again.";
                        statusTxt.classList.replace('text-yellow-400', 'text-red-400');
                        setTimeout(() => { 
                            statusTxt.innerText = "Scanner Ready"; 
                            statusTxt.classList.replace('text-red-400', 'text-emerald-400');
                        }, 2000);
                    }
                } else { 
                    statusTxt.innerText = "Could not read text."; 
                    setTimeout(() => { statusTxt.innerText = "Scanner Ready"; }, 2000); 
                }
            } catch (err) { 
                statusTxt.innerText = "Read Error"; 
            }
            
            scanLine.style.display = 'none'; 
            scanBtn.disabled = false; 
            scanBtn.innerText = "TAP TO SCAN CARD"; 
            scanBtn.classList.replace('bg-emerald-800', 'bg-emerald-600');
        }

        function addCardToInventory(cardName) {
            if (inventory[cardName]) { 
                inventory[cardName]++; 
            } else { 
                inventory[cardName] = 1; 
            }
            totalScanned++; 
            document.getElementById('card-count').innerText = totalScanned; 
            document.getElementById('export-btn').classList.remove('hidden');
            
            renderInventory(); 
            
            statusTxt.innerText = `Added: ${cardName}`; 
            statusTxt.classList.replace('text-yellow-400', 'text-blue-400');
            setTimeout(() => { 
                statusTxt.innerText = "Scanner Ready"; 
                statusTxt.classList.replace('text-blue-400', 'text-emerald-400'); 
            }, 1500);
        }

        function renderInventory() {
            const listEl = document.getElementById('inventory-list'); 
            listEl.innerHTML = '';
            const sortedCards = Object.entries(inventory).reverse();
            for (const [name, qty] of sortedCards) {
                const li = document.createElement('li'); 
                li.className = "flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700";
                li.innerHTML = `<span class="font-medium text-slate-200">${name}</span><div class="flex items-center space-x-3"><span class="text-emerald-400 font-mono text-sm">${qty}x</span><button onclick="removeCard('${name}')" class="text-red-500 hover:text-red-400 font-bold px-2">&times;</button></div>`;
                listEl.appendChild(li);
            }
        }

        function removeCard(name) { 
            totalScanned -= inventory[name]; 
            delete inventory[name]; 
            document.getElementById('card-count').innerText = totalScanned; 
            if (totalScanned === 0) document.getElementById('export-btn').classList.add('hidden'); 
            renderInventory(); 
        }
        
        function exportList() {
            let exportText = ""; 
            for (const [name, qty] of Object.entries(inventory)) { 
                exportText += `${qty}x ${name}\n`; 
            }
            navigator.clipboard.writeText(exportText).then(() => { 
                const btn = document.getElementById('export-btn'); 
                const originalText = btn.innerText; 
                btn.innerText = "Copied!"; 
                btn.classList.replace('bg-blue-600', 'bg-emerald-600'); 
                setTimeout(() => { 
                    btn.innerText = originalText; 
                    btn.classList.replace('bg-emerald-600', 'bg-blue-600'); 
                }, 2000); 
            }).catch(err => { alert("Failed to copy. Requires HTTPS."); });
        }
        
        window.onload = () => { startCamera(); initOCR(); };
    </script>
</body>
</html>
